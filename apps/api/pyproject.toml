[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cisguard-api"
version = "0.1.0"
description = "Mandar-owned CISGuard 360 backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cisguard-contracts==1.0.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pydantic-settings>=2,<3", "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "httpx>=0.28,<1", "celery[redis]>=5.4,<6", "PyJWT[crypto]>=2.10,<3"
]

[tool.setuptools]
packages = ["cisguard_api"]
py-modules = ["device_engine_port"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
