[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cisguard-contracts"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools]
packages = ["cisguard_contracts.v1"]
package-dir = {"cisguard_contracts.v1" = "v1"}

[tool.setuptools.package-data]
"cisguard_contracts.v1" = ["permissions.json", "openapi.yaml", "freeze.json"]
