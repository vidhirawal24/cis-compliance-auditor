# Install as .github/workflows/backend.yml when the team authorizes shared-root CI wiring.
name: backend
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r infra/phase1-requirements.lock.txt ./packages/contracts ./apps/api
      - run: python -m pytest -q apps/api/tests
